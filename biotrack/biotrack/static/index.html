<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2f62d7">
  <title>BIOTRACK · Hospital Félix Torrealva</title>
  <link rel="icon" href="/static/hospital.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/styles.css">
  <script defer src="/static/app.js"></script>
</head>
<body>
  <main id="login-view" class="login-view">
    <section class="login-hero" aria-label="Hospital Félix Torrealva">
      <div class="hero-photo photo-one"></div><div class="hero-photo photo-two"></div><div class="hero-photo photo-three"></div>
      <div class="hero-shade"></div>
      <div class="hero-caption"><h1>HOSPITAL FÉLIX TORREALVA</h1><p>Gestión inteligente para un cuidado<br>excepcional.</p></div>
      <div class="hero-dots" aria-hidden="true"><i></i><i></i><i></i></div>
    </section>
    <section class="login-panel">
      <div class="login-content">
        <img class="login-logo" src="/static/essalud.svg" alt="EsSalud, más y mejor para ti">
        <h2>Bienvenido</h2><p class="login-subtitle">Exclusivo para personal autorizado.</p>
        <form id="login-form">
          <label for="username">Usuario</label>
          <input id="username" name="username" autocomplete="username" placeholder="nombre_apellido" required maxlength="50">
          <label for="password">Contraseña</label>
          <div class="password-field"><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128"><button class="eye-button" type="button" id="toggle-password" aria-label="Mostrar contraseña"></button></div>
          <p id="login-error" class="form-error" role="alert" aria-live="polite"></p>
          <button class="primary login-submit" type="submit">Ingresar</button>
        </form>
        <p class="login-footnote">BIOTRACK · Control de asistencia hospitalaria</p>
      </div>
    </section>
  </main>
  <div id="app-view" class="app-view" hidden>
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#resumen" aria-label="BIOTRACK, inicio"><img src="/static/essalud.svg" alt="EsSalud"><span>H. Félix<br><strong>Torrealva</strong></span></a>
      <nav id="navigation" aria-label="Navegación principal"></nav>
      <div class="sidebar-footer"><span class="online-dot"></span><span id="connection-label">Conectado</span><small>BIOTRACK 1.0</small></div>
    </aside>
    <div class="workspace">
      <header class="topbar"><button id="menu-toggle" class="icon-button mobile-toggle" aria-label="Abrir menú"></button><h1 id="page-title">Resumen</h1><div class="account"><time id="clock"></time><button id="account-button" class="account-button" title="Cambiar mi contraseña"><span><strong id="account-name"></strong><small id="account-role"></small></span><span class="avatar" id="account-avatar"></span></button></div></header>
      <main id="page-content" class="page-content" tabindex="-1"></main>
    </div>
  </div>
  <dialog id="modal"><div class="dialog-heading"><h2 id="dialog-title"></h2><button id="dialog-close" class="icon-button" aria-label="Cerrar ventana"></button></div><form id="dialog-form"><div id="dialog-content"></div><p id="dialog-error" class="form-error" role="alert"></p><div class="dialog-footer"><button type="button" id="dialog-cancel" class="secondary">Cancelar</button><button type="submit" class="primary" id="dialog-save">Guardar</button></div></form></dialog>
  <div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
