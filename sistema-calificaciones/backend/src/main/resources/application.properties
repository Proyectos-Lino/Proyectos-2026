spring.application.name=lector-dbf

# PUERTO
server.port=8080

# POSTGRESQL
spring.datasource.url=jdbc:postgresql://localhost:5432/sistema_calificaciones
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:}
# La estructura de PostgreSQL se gestiona exclusivamente con Flyway.
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# FILES
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=60MB

app.evidence.max-bytes=10485760
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.bootstrap-token=${BOOTSTRAP_TOKEN:}
spring.config.import=optional:file:./config/application-local.properties
