# Praxis on Dokploy (Docker Compose service).
# - Variables: Dokploy → Environment tab (it writes them to .env next to this file).
# - Domain: Dokploy → Domains tab → service "frontend", port 3000, HTTPS with Let's Encrypt.
#   Traefik (installed by Dokploy) terminates HTTPS; no host ports are published here.
services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_DRIVER: postgres
      DATABASE_URL: ${DATABASE_URL:?Configura DATABASE_URL}
      STORAGE_DRIVER: cloudinary
      HOST: 0.0.0.0
      NODE_ENV: production
      PORT: 4000
      # Traefik → Next.js → API: Next.js keeps the visitor IP that Traefik sends in X-Forwarded-For.
      TRUST_PROXY: 1
    volumes:
      - praxis_storage:/app/storage
    networks:
      - default
      - dokploy-network
    mem_limit: 1g
  frontend:
    build:
      context: ./frontend
      args:
        API_URL: http://backend:4000
    environment:
      API_URL: http://backend:4000
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      - backend
    mem_limit: 768m
volumes:
  praxis_storage:
networks:
  dokploy-network:
    external: true
