spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
server.port=${PORT:8080}
server.address=0.0.0.0
server.forward-headers-strategy=framework

server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:none}
odontocare.frontend-url=${FRONTEND_URL}

# Public receiver hosted by this backend; provider credentials are configured in the application.
odontocare.integrations.public-base-url=${WHATSAPP_WEBHOOK_BASE_URL:https://api-odontocare.camiluxlym.com}
