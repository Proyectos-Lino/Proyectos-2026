
spring.application.name=admision

# Credenciales locales (Cloudinary, Gemini): si existe application-local.properties se carga solo.
# Ese archivo NO se sube a git. En Docker/Dokploy las claves van como variables de entorno (ver .env.example).
spring.config.import=optional:classpath:application-local.properties

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bd_examen_admi}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:adminUTP}

spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Puerto y dirección de red
server.address=0.0.0.0
server.port=8080

# Subida de archivos (páginas escaneadas pueden pesar varios MB)
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=150MB

# Imágenes: 'local' guarda en disco y funciona sin internet; 'cloudinary' las sube a la nube.
app.imagenes.almacenamiento=${IMAGENES_ALMACENAMIENTO:local}
app.imagenes.directorio=${IMAGENES_DIRECTORIO:uploads}

# Cloudinary (solo si app.imagenes.almacenamiento=cloudinary): variables de entorno o application-local.properties.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Gemini — configurar via variable de entorno GEMINI_API_KEY (requerido en produccion)
gemini.api.key=${GEMINI_API_KEY:CHANGE_ME}